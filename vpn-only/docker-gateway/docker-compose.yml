# API Users gateway – runs on the gateway host (e.g. a Docker VM/LXC at 192.168.8.100).
# kamailio + rtpengine use host networking (SIP/RTP need the real IP).
# The panel is published ONLY on the LAN IP; Proxmox firewall lets only NPM (192.168.8.147) reach it.
name: pbx-api-gateway

services:
  kamailio:
    build: ./kamailio
    network_mode: host
    env_file: .env
    restart: unless-stopped
    depends_on: [rtpengine]

  rtpengine:
    build: ./rtpengine
    network_mode: host
    env_file: .env
    restart: unless-stopped

  panel:
    build: ./panel
    env_file: .env
    ports:
      - "${GW_LAN_IP}:8000:8000"
    volumes:
      - ./ssh:/ssh:ro
    restart: unless-stopped
